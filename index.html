<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MATHias</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>" />
  <link rel="stylesheet" href="css/paleta.css" />

  <style>
    /* ── Calculadora ── */
    .calculadora {
      background-color: var(--quadro-dark);
      border: 2px solid var(--madeira);
      border-radius: var(--radius);
      padding: clamp(12px, 3vw, 20px);
      width: min(340px, 100%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .display {
      background-color: rgba(17, 36, 28, 0.7);
      border-radius: 8px;
      padding: clamp(10px, 2.5vw, 16px);
      margin-bottom: 14px;
      text-align: right;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #expressao {
      color: var(--giz-escuro);
      font-family: 'Caveat', cursive;
      font-size: clamp(13px, 2.5vw, 15px);
      min-height: 20px;
    }

    #valor {
      color: var(--giz);
      font-family: 'Special Elite', cursive;
      font-size: clamp(28px, 7vw, 42px);
      word-break: break-all;
      line-height: 1.1;
      transition: font-size 0.1s;
    }

    /* ── Grade de botões ── */
    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(5px, 1.5vw, 8px);
    }

    button {
      height: clamp(50px, 12vw, 62px);
      border: none;
      border-radius: 8px;
      font-family: 'Special Elite', cursive;
      font-size: clamp(14px, 3.5vw, 18px);
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    .limpar,
    .apagar,
    .operacao {
      background-color: var(--quadro-op);
      color: var(--giz);
    }

    .numero {
      background-color: var(--quadro-light);
      color: white;
    }

    .numero.zero {
      grid-column: span 2;
    }

    .igual {
      background-color: var(--vermelho);
      color: var(--ink);
      font-size: clamp(18px, 4vw, 24px);
    }

    .igual:hover {
      background: #ce4a39;
    }

    .numero:hover {
      background: #244739;
    }

    .operacao:hover,
    .limpar:hover,
    .apagar:hover {
      background: #14573b;
    }

    /* ── Layout separar (calc + histórico) ── */
    .separar {
      display: flex;
      gap: clamp(20px, 4vw, 40px);
      flex-wrap: wrap;
      align-items: flex-start;
    }

    /* ── Histórico ── */
    .separar2 {
      flex: 1;
      min-width: 200px;
    }

    .separar2>p {
      font-family: 'Caveat', cursive;
      color: var(--giz);
      font-size: clamp(18px, 4vw, 25px);
      margin-bottom: 4px;
      padding-bottom: 6px;
    }

    .riscado {
      color: var(--giz);
      border-bottom: 2px dashed rgba(255, 255, 255, 0.2);
      font-size: clamp(16px, 3.5vw, 22px);
      padding-bottom: 6px;
      margin-bottom: 4px;
    }

    #historico {
      width: 100%;
      min-height: 60px;
      max-height: 300px;
      overflow-y: auto;
      padding: 10px 10px 10px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
    }

    #historico p {
      font-size: clamp(16px, 3.5vw, 22px);
      color: var(--giz-escuro);
    }

    #historico::-webkit-scrollbar {
      width: 8px;
    }

    #historico::-webkit-scrollbar-track {
      background: transparent;
    }

    #historico::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    #historico::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* ── Mobile: empilhar calculadora + histórico ── */
    @media (max-width: 600px) {
      .calculadora {
        width: 100%;
      }

      .separar {
        flex-direction: column;
      }

      .separar2 {
        width: 100%;
        min-width: unset;
      }
    }
  </style>
</head>

<body>

  <div class="quadro">
    <div class="quadro-dentro">
      <h1>📐 MATHias</h1>
      <h2>Calculadora Avançada.</h2>
      <div class="risco"></div>
    </div>
  </div>

  <div class="tabela-container">
    <table class="aba">
      <tr>
        <td data-emoji="🔢" id="inicial">Básica</td>
        <td data-emoji="📊" id="avancada">Avançada</td>
        <td data-emoji="✏️" id="equacao">Equações E Texto</td>
        <td data-emoji="#️⃣​" id="matriz">Matriz</td>
      </tr>
    </table>
  </div>

  <div class="quadro">
    <div class="quadro-dentro">
      <div class="separar">

        <div class="calculadora">
          <div class="display">
            <span id="expressao"></span>
            <span id="valor">0</span>
          </div>
          <div class="botoes">
            <button class="limpar" onclick="limpar()">AC</button>
            <button class="apagar" onclick="apagar()">⌫</button>
            <button class="operacao" onclick="escolherOperacao('%')">%</button>
            <button class="operacao" onclick="escolherOperacao('÷')">÷</button>

            <button class="numero" onclick="insert('7')">7</button>
            <button class="numero" onclick="insert('8')">8</button>
            <button class="numero" onclick="insert('9')">9</button>
            <button class="operacao" onclick="escolherOperacao('×')">×</button>

            <button class="numero" onclick="insert('4')">4</button>
            <button class="numero" onclick="insert('5')">5</button>
            <button class="numero" onclick="insert('6')">6</button>
            <button class="operacao" onclick="escolherOperacao('-')">-</button>

            <button class="numero" onclick="insert('1')">1</button>
            <button class="numero" onclick="insert('2')">2</button>
            <button class="numero" onclick="insert('3')">3</button>
            <button class="operacao" onclick="escolherOperacao('+')">+</button>

            <button class="numero zero" onclick="insert('0')">0</button>
            <button class="igual" onclick="insert('.')">.</button>
            <button class="igual" onclick="calcular()">=</button>
          </div>
        </div>

        <div class="separar2">
          <p>Histórico de Cálculos:</p>
          <div class="riscado"></div>
          <div id="historico"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/calculo.js"></script>
</body>

</html>
